name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Manual run — use this to publish content edits made in the Google Sheet.
  workflow_dispatch:
  # Pick up Sheet edits once a day without anyone having to remember.
  schedule:
    - cron: "17 20 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Optional: refresh content/*.csv from the Sheet before building. The
      # Sheet is link-viewable, so this needs a repository *variable*, not a
      # secret. Without it the committed CSVs are used as-is.
      - name: Refresh content from Google Sheet
        if: vars.CONTENT_SHEET_ID != ''
        env:
          CONTENT_SHEET_ID: ${{ vars.CONTENT_SHEET_ID }}
        run: npm run sync:content

      - name: Build static site
        env:
          # Project page, so the site lives under /<repo>.
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
        run: |
          npm run build
          touch out/.nojekyll   # keep _next/ from being swallowed by Jekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
