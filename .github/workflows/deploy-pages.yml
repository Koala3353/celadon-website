name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Manual run — use this to publish content edits made in the Google Sheet.
  workflow_dispatch:
  # Pick up Sheet edits every 3 hours without anyone having to remember to
  # trigger a rebuild. The Sheet doesn't change often enough to need faster
  # than this — a manual `gh workflow run deploy-pages.yml` still covers the
  # "I need it live right now" case.
  schedule:
    - cron: "17 */3 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish; queue at most one more.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Optional: refresh content/*.csv from the Sheet before building. The
      # Sheet is link-viewable, so this needs a repository *variable*, not a
      # secret. Without it the committed CSVs are used as-is.
      # A Sheet that's unreachable (unshared, renamed tab, Google outage) must
      # not take the site down — the script leaves the committed CSVs in place
      # and the build carries on with the last known-good content.
      - name: Refresh content from Google Sheet
        if: vars.CONTENT_SHEET_ID != ''
        continue-on-error: true
        env:
          CONTENT_SHEET_ID: ${{ vars.CONTENT_SHEET_ID }}
        run: npm run sync:content

      - name: Build static site
        env:
          # ateneoceladon.com is a custom domain mapped to the Pages site, so
          # it's served at the domain root, not under /<repo>. PAGES_BASE_PATH
          # must stay empty here — set it back to /${{ github.event.repository.name }}
          # only if the custom domain is ever removed and the site reverts to
          # koala3353.github.io/celadon-website/.
          PAGES_BASE_PATH: ""
        run: |
          npm run build
          touch out/.nojekyll        # keep _next/ from being swallowed by Jekyll
          echo "ateneoceladon.com" > out/CNAME   # Pages re-derives this from the
                                                  # repo's custom-domain setting on
                                                  # every deploy unless the file
                                                  # ships in the artifact itself.

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
